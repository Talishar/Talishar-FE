name: i18n Linting
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Install modules
        run: npm install --legacy-peer-deps
      - name: Run i18n Linting
        run: npx i18next-cli lint
